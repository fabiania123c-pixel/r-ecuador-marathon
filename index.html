<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Foto con La Tri x Marathon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #000; font-family: 'Arial Black', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }

    #loading {
      position: fixed; inset: 0; z-index: 999;
      background: linear-gradient(160deg, #0d1b3e 0%, #1B4B8A 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity 0.6s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .ld-logo { color: #fff; font-size: 34px; font-weight: 900; letter-spacing: 5px; }
    .ld-sub { color: #FFD700; font-size: 12px; letter-spacing: 4px; }
    .ld-spinner { width: 50px; height: 50px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.1); border-top-color: #E8202A; animation: spin 0.8s linear infinite; }
    .ld-txt { color: rgba(255,255,255,0.7); font-size: 13px; letter-spacing: 1px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #app { position: relative; width: 100vw; height: 100vh; }
    #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #capture { display: none; }

    #topbar {
      position: absolute; top: 0; left: 0; right: 0; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
      z-index: 10; pointer-events: none;
    }
    .brand { color: #fff; font-size: 18px; font-weight: 900; letter-spacing: 3px; }
    .fef { color: #FFD700; font-size: 10px; letter-spacing: 3px; font-weight: 700; }

    #bottombar {
      position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px 40px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
      z-index: 10;
    }
    .hint { color: rgba(255,255,255,0.85); font-size: 12px; letter-spacing: 1px; background: rgba(0,0,0,0.4); padding: 6px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); }
    #size-wrap { display: flex; align-items: center; gap: 10px; width: 85%; }
    #size-wrap label { color: rgba(255,255,255,0.7); font-size: 11px; letter-spacing: 1px; white-space: nowrap; }
    #size-slider { flex: 1; -webkit-appearance: none; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.3); outline: none; }
    #size-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #E8202A; cursor: pointer; }
    .btn-row { display: flex; align-items: center; gap: 28px; }
    #flip-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 22px; }
    #photo-btn { background: #fff; border: 4px solid rgba(255,255,255,0.4); border-radius: 50%; width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 3px #E8202A; transition: transform 0.1s; }
    #photo-btn:active { transform: scale(0.9); }
    .shutter { width: 60px; height: 60px; border-radius: 50%; background: #fff; }
    #flash { position: fixed; inset: 0; z-index: 500; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.08s ease; }
    #flash.on { opacity: 1; }
    #toast { position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%); background: rgba(13,27,62,0.95); border: 1px solid #FFD700; color: #FFD700; font-size: 13px; letter-spacing: 1px; padding: 10px 24px; border-radius: 30px; z-index: 200; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; white-space: nowrap; }
    #toast.show { opacity: 1; }
    #cam-error { position: fixed; inset: 0; z-index: 900; background: #0d1b3e; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px; text-align: center; }
    #cam-error.show { display: flex; }
    #cam-error h2 { color: #E8202A; font-size: 20px; }
    #cam-error p { color: rgba(255,255,255,0.7); font-size: 14px; line-height: 1.6; }
    #cam-error button { background: #E8202A; color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
<div id="loading">
  <div class="ld-logo">MARATHON</div>
  <div class="ld-sub">⚽ SELECCIÓN ECUADOR ⚽</div>
  <div class="ld-spinner"></div>
  <div class="ld-txt">Iniciando cámara...</div>
</div>
<div id="flash"></div>
<div id="toast">📸 ¡Foto guardada!</div>
<div id="cam-error">
  <h2>⚠️ Sin acceso a cámara</h2>
  <p>Permite el acceso a la cámara en tu navegador y recarga la página.<br><br>iPhone: Ajustes → Safari → Cámara → Permitir</p>
  <button onclick="location.reload()">Reintentar</button>
</div>
<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="topbar">
    <div class="brand">MARATHON</div>
    <div class="fef">🇪🇨 FEF ECUADOR</div>
  </div>
  <div id="bottombar">
    <div class="hint">👆 Arrastra · 🤏 Pellizca para tamaño</div>
    <div id="size-wrap">
      <label>TAMAÑO</label>
      <input type="range" id="size-slider" min="15" max="150" value="80">
    </div>
    <div class="btn-row">
      <div id="flip-btn" onclick="flipCamera()">🔄</div>
      <div id="photo-btn" onclick="takePhoto()"><div class="shutter"></div></div>
      <div style="width:52px"></div>
    </div>
  </div>
</div>
<canvas id="capture"></canvas>

async function startCamera() {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
    loading.classList.add('hide');
    startRender();
  } catch(e) {
    loading.classList.add('hide');
    document.getElementById('cam-error').classList.add('show');
  }
}

function getPlayerDims() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  const pct = parseInt(slider.value) / 100;
  const h = H * pct;
  const w = h * (playerImg.width / playerImg.height);
  return { w, h };
}

function startRender() {
  if (animId) cancelAnimationFrame(animId);
  function draw() {
    const W = window.innerWidth;
    const H = window.innerHeight;
    ctx.clearRect(0, 0, W, H);
    if (imgLoaded) {
      const { w, h } = getPlayerDims();
      // Use high quality image smoothing
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(playerImg, playerX - w/2, playerY - h, w, h);
    }
    animId = requestAnimationFrame(draw);
  }
  draw();
}

function takePhoto() {
  const flash = document.getElementById('flash');
  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 150);

  // Capture at full device resolution
  const W = window.innerWidth * DPR;
  const H = window.innerHeight * DPR;
  const cap = document.getElementById('capture');
  cap.width = W;
  cap.height = H;
  const cctx = cap.getContext('2d');
  cctx.imageSmoothingEnabled = true;
  cctx.imageSmoothingQuality = 'high';

  // Draw video
  cctx.save();
  if (facingMode === 'user') { cctx.translate(W, 0); cctx.scale(-1, 1); }
  cctx.drawImage(video, 0, 0, W, H);
  cctx.restore();

  // Draw players at DPR scale
  if (imgLoaded) {
    const { w, h } = getPlayerDims();
    cctx.drawImage(playerImg, (playerX - w/2) * DPR, (playerY - h) * DPR, w * DPR, h * DPR);
  }

  cap.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'foto-con-la-tri-' + Date.now() + '.jpg';
    a.click();
    URL.revokeObjectURL(url);
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }, 'image/jpeg', 0.97);
}

async function flipCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  await startCamera();
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    isDragging = true;
    dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
    dragImgX = playerX; dragImgY = playerY;
  }
  lastPinchDist = null;
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (lastPinchDist !== null) {
      const delta = (dist - lastPinchDist) * 0.3;
      slider.value = Math.min(150, Math.max(15, parseFloat(slider.value) + delta));
    }
    lastPinchDist = dist;
  } else if (e.touches.length === 1 && isDragging) {
    playerX = dragImgX + (e.touches[0].clientX - dragStartX);
    playerY = dragImgY + (e.touches[0].clientY - dragStartY);
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault(); isDragging = false; lastPinchDist = null;
}, { passive: false });

canvas.addEventListener('mousedown', e => { isDragging = true; dragStartX = e.clientX; dragStartY = e.clientY; dragImgX = playerX; dragImgY = playerY; });
canvas.addEventListener('mousemove', e => { if (isDragging) { playerX = dragImgX + (e.clientX - dragStartX); playerY = dragImgY + (e.clientY - dragStartY); } });
canvas.addEventListener('mouseup', () => isDragging = false);

startCamera();
</script>
